packages:
  - apps/*
  - packages/*

# pnpm 11: workspace-level settings live here (.npmrc is registry/auth only)
minimumReleaseAge: 0
allowBuilds:
  argon2: true
  prisma: true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true
  msgpackr-extract: true
  '@google/genai': true
  protobufjs: true
