name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated Prisma client is gitignored; prisma.config.ts needs DATABASE_URL set (not used by generate).
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Build first: workspace packages resolve each other via dist/ types,
      # so typecheck/lint need the topologically-ordered build output.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Contract drift: the committed openapi.json must match the manifest.
      - run: pnpm openapi:export && git diff --exit-code openapi/openapi.json
      # Migration drift: schema.prisma must be fully captured by migrations.
      - run: |
          pnpm --filter @ursainyk/db exec prisma migrate deploy
          pnpm --filter @ursainyk/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # e2e: full AppModule against a fresh database (globalSetup creates ursainyk_e2e).
      - run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
