# Local infra only. `docker compose up -d` — then `pnpm dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nabhahita
      POSTGRES_PASSWORD: nabhahita
      POSTGRES_DB: nabhahita
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
  miniodata:
